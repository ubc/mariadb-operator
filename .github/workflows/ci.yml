name: CI

on:
  push:
    branches:
      - main
  pull_request: {}

env:
  GOLANGCI_VERSION: "v2.11.2"

jobs:
  detect-noop:
    name: Detect noop
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      # Inline replacement for fkirc/skip-duplicate-actions, which is pinned to
      # Node.js 20 and unmaintained since 2023-10. We only used its paths_ignore
      # feature (concurrent_skipping and skip_after_successful_duplicate were
      # disabled), so a small git-diff check is equivalent and removes the
      # Node 20 deprecation warning.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect no-op changes
        id: noop
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi
          # New branch push has base == 0000...000; nothing to diff against, so
          # run all jobs to be safe.
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ]; then
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
            echo "First push / new branch — running all jobs."
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$head" || true)
          echo "Changed files between $base..$head:"
          echo "$changed"
          # Same ignore patterns as the previous fkirc/skip-duplicate-actions config:
          #   *.md           — markdown anywhere
          #   *.md.gotmpl    — gotmpl markdown anywhere
          #   .github/**     — workflow + GH config
          #   docs/**        — docs tree
          #   examples/**    — examples tree
          meaningful=$(echo "$changed" | grep -vE '(\.md(\.gotmpl)?$|^\.github/|^docs/|^examples/)' || true)
          if [ -n "$changed" ] && [ -z "$meaningful" ]; then
            echo "All changes are in ignored paths — skipping downstream jobs."
            echo "should_skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Meaningful changes detected — running downstream jobs."
            echo "should_skip=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}

  typos:
    name: Typos
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Find typos
        uses: crate-ci/typos@v1.44.0
        with:
          files: ./api ./cmd ./internal ./pkg
          config: ./.typos.toml

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build
        run: make build

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mariadb-operator:main
            ghcr.io/${{ github.repository_owner }}/mariadb-operator:${{ github.sha }}

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Test
        run: |
          make helm-crds
          make test

  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Determine test
        id: test
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Detected push to main. Running full tests."
            echo "type=full" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.head_ref }}" =~ ^(release|feature|fix).*$ ]]; then
            echo "Detected PR from release, feature or fix branch. Running full tests."
            echo "type=full" >> "$GITHUB_OUTPUT"
          else
            echo "Defaulting to basic tests"
            echo "type=basic" >> "$GITHUB_OUTPUT"
          fi

      - name: Cluster
        run: |
          make cluster
          make install
          make install-csi-hostpath
          make install-minio
          make install-cert-manager
          make net
          make install-azurite

      - name: Run integration tests
        if: ${{ steps.test.outputs.type == 'full' }}
        run: make test-int

      - name: Run basic integration tests
        if: ${{ steps.test.outputs.type == 'basic' }}
        run: make test-int-basic

      - name: Post Test Debugging (on failure)
        if: failure()
        run: make dump

  artifacts:
    name: Artifacts
    runs-on: ubuntu-latest
    needs: detect-noop
    if: ${{ needs.detect-noop.outputs.noop != 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate
        run: make gen

      - name: Check diff
        uses: mmontes11/diff-porcelain@v0.0.1
        with:
          message: Generated artifacts are not up to date. Run 'make gen' and commit the changes.

      - name: Check CRD size
        run: make crd-size
